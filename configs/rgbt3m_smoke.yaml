# Small CPU smoke-test split; not for reporting final results.
name: RGBT-3M
path: /path/to/RGBT-3M
train: train_1024.txt
val: val_256.txt
nc: 2
names: {0: fire, 1: person}
input_channels: 6
input_mode: dual_input
