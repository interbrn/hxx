# CPU micro-smoke only: RGB 480x640, IR 240x320 before feature alignment.
name: RGBT-3M
path: /path/to/RGBT-3M
train: splits/train_grouped_micro.txt
val: splits/val_grouped_micro.txt
test: splits/test_grouped_micro.txt
nc: 2
names: {0: fire, 1: person}
input_channels: 6
input_mode: dual_input
rgb_dir: RGB
thermal_dir: IR
