# 1:1 严格分组基线：RGB/IR 同分辨率，作为 2:1 实验对照。
name: RGBT-3M
path: /path/to/RGBT-3M
train: splits/train_grouped.txt
val: splits/val_grouped.txt
test: splits/test_grouped.txt
nc: 2
names: {0: fire, 1: person}
input_channels: 6
input_mode: dual_input
