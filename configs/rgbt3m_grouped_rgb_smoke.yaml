# RGB 单模态 smoke 基线：与 2:1 smoke 实验使用完全相同的视频分组。
name: RGBT-3M
path: /path/to/RGBT-3M
train: splits/train_grouped_smoke.txt
val: splits/val_grouped_smoke.txt
test: splits/test_grouped_smoke.txt
nc: 2
names: {0: fire, 1: person}
input_channels: 6
input_mode: rgb_input
rgb_dir: RGB
thermal_dir: IR
label_dir: labels_fire_person
image_ext: .jpg
img_size: [480, 640]
format: yolo
resolution_ratio: 1
rgb_size: [480, 640]
ir_size: [480, 640]
ir_interpolation: area
ir_antialias: true
